<script>
  (function() {
    let passwordLength = 8;
    const bulletsContainer = document.getElementById('password-bullets');
    const clearBtn = document.getElementById('clear-btn');
    const backspaceBtn = document.getElementById('backspace-btn');
    const enterBtn = document.getElementById('enter-btn');
    const shiftBtn = document.getElementById('shift-btn');
    const biometricBtn = document.getElementById('biometric-btn');
    const keyBtns = document.querySelectorAll('.key-btn');
    const suggestionChips = document.querySelectorAll('.suggestion-chip');
    let isShifted = false;

    function renderBullets() {
      bulletsContainer.innerHTML = '';
      for (let i = 0; i < passwordLength; i++) {
        const dot = document.createElement('span');
        dot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-primary shadow-[0_0_6px_rgba(255,255,255,0.8)] transition-transform duration-100 scale-100';
        bulletsContainer.appendChild(dot);
      }
    }

    function addChar() {
      if (passwordLength < 32) {
        passwordLength++;
        renderBullets();
        if (navigator.vibrate) navigator.vibrate(8);
      }
    }

    function deleteChar() {
      if (passwordLength > 0) {
        passwordLength--;
        renderBullets();
        if (navigator.vibrate) navigator.vibrate(12);
      }
    }

    keyBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        addChar();
      });
    });

    const spaceBtn = document.getElementById('space-btn');
    if (spaceBtn) {
      spaceBtn.addEventListener('click', addChar);
    }

    if (backspaceBtn) {
      backspaceBtn.addEventListener('click', deleteChar);
    }

    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        passwordLength = 0;
        renderBullets();
        if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
      });
    }

    if (shiftBtn) {
      shiftBtn.addEventListener('click', () => {
        isShifted = !isShifted;
        shiftBtn.classList.toggle('bg-primary', isShifted);
        shiftBtn.classList.toggle('text-on-primary', isShifted);
        keyBtns.forEach(k => {
          if (k.textContent.length === 1 && /[a-z]/i.test(k.textContent)) {
            k.textContent = isShifted ? k.textContent.toUpperCase() : k.textContent.toLowerCase();
          }
        });
      });
    }

    suggestionChips.forEach(chip => {
      chip.addEventListener('click', () => {
        passwordLength = 16;
        renderBullets();
        if (navigator.vibrate) navigator.vibrate(20);
      });
    });

    if (enterBtn) {
      enterBtn.addEventListener('click', () => {
        const originalHtml = enterBtn.innerHTML;
        enterBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span>';
        enterBtn.classList.add('opacity-80');
        setTimeout(() => {
          enterBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] text-secondary">check</span>';
          setTimeout(() => {
            enterBtn.innerHTML = originalHtml;
            enterBtn.classList.remove('opacity-80');
          }, 1200);
        }, 800);
      });
    }

    if (biometricBtn) {
      biometricBtn.addEventListener('click', () => {
        if (navigator.vibrate) navigator.vibrate([20, 50, 20]);
        biometricBtn.classList.add('bg-secondary/20');
        setTimeout(() => {
          biometricBtn.classList.remove('bg-secondary/20');
        }, 400);
      });
    }
  })();
</script></main></body></html>
