name: Android CI

# Verification-only build: unit tests, lint and a debug APK. Needs no signing
# secrets and never touches the release keystore, so it is safe to run on any
# branch or pull request. Production signing stays in android-release.yml
# (main pushes and v* tags only).

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint & debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      # Runs even when the step above failed, so one push reports both.
      - name: Lint
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug --stacktrace

      # Renders the real screens (UiSnapshotTest) to PNGs for visual review.
      - name: Render UI snapshots
        if: ${{ !cancelled() }}
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: Upload UI snapshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: AtomicVault-UI-Snapshots-${{ github.run_number }}
          path: app/build/ui-snapshots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: AtomicVault-CI-Reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AtomicVault-Debug-APK-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
